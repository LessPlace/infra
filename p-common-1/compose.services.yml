name: less-services
services:
  control-plane:
    image: cr.yandex/crp5f6o2ivb58ruhp27e/control-plane@sha256:89f761f3be7f2359d1313a7d67170c6707256db600a5deb6a5bdec085828b1b5
    restart: unless-stopped
    init: true
    cpus: 0.20
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    env_file:
      - path: /etc/less/secrets/control-plane.env
        format: raw
      - path: /etc/less/secrets/monium.env
        format: raw
    environment:
      OTEL_SDK_DISABLED: 'false'
      OTEL_SERVICE_NAME: control-plane-api
      APP_MODE: production
      APP_STAND: production
      APP_HTTP_HOST: 0.0.0.0
      APP_HTTP_PORT: '7010'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: controlplane
      DB_DATABASE: controlplane
      LOG_FILE_PATH: /var/log/less/control-plane-api.log
      LOG_LEVEL: info
    volumes:
      - /var/log/less/control-plane:/var/log/less
    networks: [database]
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:7010/health']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  accounts:
    image: cr.yandex/crp5f6o2ivb58ruhp27e/accounts@sha256:d7295cc7dae1a2a18473f7ad4dd4c1a45d36d7a20d6e0c127b44e86b3949e3f8
    restart: unless-stopped
    init: true
    cpus: 0.20
    mem_limit: 576m
    memswap_limit: 576m
    pids_limit: 128
    env_file:
      - path: /etc/less/secrets/accounts.env
        format: raw
      - path: /etc/less/secrets/mail.env
        format: raw
      - path: /etc/less/secrets/smartcaptcha.env
        format: raw
      - path: /etc/less/secrets/oauth.env
        format: raw
      - path: /etc/less/secrets/monium.env
        format: raw
    environment:
      OTEL_SDK_DISABLED: 'false'
      OTEL_SERVICE_NAME: less-accounts-api
      APP_MODE: production
      APP_STAND: production
      APP_HTTP_HOST: 0.0.0.0
      APP_HTTP_PORT: '1713'
      APP_IDENTITY_SHARD: '0'
      APP_PUBLIC_ORIGIN: https://less.place
      APP_ALLOW_PRIVATE_PLAINTEXT_DEPENDENCIES: 'true'
      APP_TRUSTED_PROXY_IPS: '172.18.0.3'
      SMARTCAPTCHA_ENABLED: 'true'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: less_accounts
      DB_DATABASE: less_accounts
      DB_TLS: disable
      VALKEY_HOST: valkey
      VALKEY_PORT: '6379'
      VALKEY_USERNAME: accounts
      VALKEY_NAMESPACE: less:accounts:v1
      VALKEY_TLS: 'false'
      AUTH_COOKIE_NAME: __Host-less_sid
      AUTH_COOKIE_SECURE: 'true'
      AUTH_MANUAL_REGISTRATION_APPROVAL: 'true'
      OAUTH_ENABLED: 'true'
      OAUTH_PUBLIC_BASE_URL: https://less.place
      MAIL_MODE: smtp
      MAIL_REGISTRATION_REVIEW_RECIPIENT: kirill@kirilltitov.com
      MAIL_REGISTRATION_REVIEW_URL: https://backoffice.less.place/#registration-approvals
      MAIL_FROM_ADDRESS: noreply@less.place
      MAIL_FROM_NAME: Лес
      MAIL_SMTP_HOSTS: postbox.cloud.yandex.net
      MAIL_SMTP_PORT: '587'
      MAIL_SMTP_TLS: starttls
      CONTENT_BASE_URL: http://unavailable-content:1712
      S3_ENDPOINT: https://storage.yandexcloud.net
      S3_REGION: ru-central1
      S3_BUCKET: less-accounts-prod
      S3_DEDICATED_BUCKET: 'true'
      LOG_FILE_PATH: /var/log/less/less-accounts-api.log
      LOG_LEVEL: info
    volumes:
      - /var/log/less/accounts:/var/log/less
    networks:
      database: {}
      web:
        ipv4_address: 172.18.0.4
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:1713/health']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  database:
    external: true
    name: less-database
  web:
    external: true
    name: less-web
