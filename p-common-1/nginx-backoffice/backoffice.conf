# Соединения и запросы основного сайта не расходуют лимиты админки.
limit_req_zone $binary_remote_addr zone=backoffice_requests:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=backoffice_connections:1m;

server {
    listen 80;
    server_name backoffice.less.place;
    return 308 https://backoffice.less.place$request_uri;
}
server {
    listen 443 ssl;
    server_name backoffice.less.place;
    ssl_certificate /etc/less/certificates/current/fullchain.pem;
    ssl_certificate_key /etc/less/certificates/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/less/backoffice-pki/admin-client-ca.pem;
    ssl_trusted_certificate /etc/less/backoffice-pki/root.cert.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_crl /etc/less/backoffice-pki/client-crls.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    limit_req zone=backoffice_requests burst=50 nodelay;
    limit_conn backoffice_connections 100;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location ^~ /api/backoffice/ {
        proxy_next_upstream off;
        set $backoffice_api http://backoffice-api:17471;
        proxy_pass $backoffice_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header X-Backoffice-TLS-Verify $ssl_client_verify;
        proxy_set_header X-Backoffice-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Backoffice-Client-Serial $ssl_client_serial;
        proxy_set_header X-Backoffice-Client-Subject $ssl_client_s_dn;
        proxy_set_header X-Backoffice-Admin-ID "";
        proxy_set_header X-Backoffice-Roles "";
        include /etc/less/backoffice-proxy.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / {
        set $backoffice_web http://backoffice-web:8080;
        proxy_pass $backoffice_web;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
}
