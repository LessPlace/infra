name: less-edge
services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    cpus: 0.20
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    ports:
      - '${EDGE_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${EDGE_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    environment:
      NGINX_WORKER_PROCESSES: '1'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LESS_SECRETS:-/etc/less/secrets}/certificates:/etc/less/certificates:ro
      - ${LESS_SECRETS:-/etc/less/secrets}/web.htpasswd:/etc/less/web.htpasswd:ro
    networks:
      web:
        # Существующая сеть less-web: 172.18.0.0/16. Accounts доверяет только этому адресу.
        ipv4_address: 172.18.0.3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/health']
      interval: 30s
      timeout: 3s
      retries: 3
networks:
  web:
    external: true
    name: less-web
