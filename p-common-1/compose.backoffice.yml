name: less-backoffice
services:
  backoffice-api:
    image: cr.yandex/crp5f6o2ivb58ruhp27e/backoffice-api@sha256:7aa98b16852c849c5b56c32c84b637b5dcf0ba95ba56290360e3e0e80bd24e18
    restart: unless-stopped
    init: true
    cpus: 0.20
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    env_file:
      - path: /etc/less/secrets/backoffice.env
        format: raw
      - path: /etc/less/secrets/monium.env
        format: raw
    environment:
      OTEL_SDK_DISABLED: 'false'
      OTEL_SERVICE_NAME: backoffice-api
      APP_HTTP_HOST: 0.0.0.0
      APP_HTTP_PORT: '17471'
      APP_ENVIRONMENT: production
      APP_CONTAINER_NETWORK: 'true'
      APP_TRUSTED_PROXY_IPS: 172.30.10.2
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: backoffice
      DB_DATABASE: backoffice
      AUTH_ROOT_CERTIFICATE_FILE: /etc/less/backoffice-pki/root.cert.pem
      AUTH_ISSUER_CERTIFICATE_FILE: /etc/less/backoffice-pki/admin-ca.cert.pem
      SECURITY_PUBLIC_ORIGIN: https://backoffice.less.place
      SECURITY_RP_ID: backoffice.less.place
      BACKOFFICE_INTEGRATIONS_FILE: /etc/less/transport/links.json
    extra_hosts:
      content-1.backoffice.internal: 10.130.0.4
    volumes:
      - /etc/less/backoffice-reader/links.json:/etc/less/transport/links.json:ro
      - /etc/less/backoffice-transport/ca.cert.pem:/etc/less/transport/ca.cert.pem:ro
      - /etc/less/backoffice-transport/client.cert.pem:/etc/less/transport/client.cert.pem:ro
      - /etc/less/backoffice-transport/client.key.pem:/etc/less/transport/client.key.pem:ro
      - /etc/less/backoffice-pki:/etc/less/backoffice-pki:ro
    networks:
      access: {}
      database: {}
      backoffice:
        ipv4_address: 172.30.10.3
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:17471/ready']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  backoffice-web:
    image: cr.yandex/crp5f6o2ivb58ruhp27e/backoffice-web:latest
    restart: unless-stopped
    cpus: 0.05
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    networks:
      backoffice:
        ipv4_address: 172.30.10.4
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  access:
    external: true
    name: less-backoffice-access
  database:
    external: true
    name: less-database
  backoffice:
    name: less-backoffice
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
