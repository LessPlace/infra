user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 512; }
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Не журналируем строку запроса: позднее в ней могут быть OAuth-коды.
    log_format safe '$remote_addr $host [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    server_tokens off;
    sendfile on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=per_ip:1m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/backoffice.d/*.conf;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }
    server {
        listen 80;
        server_name less.place less.su *.less.su;
        return 308 https://less.place$request_uri;
    }
    server {
        listen 443 ssl;
        server_name less.su *.less.su;
        ssl_certificate /etc/less/certificates/current/fullchain.pem;
        ssl_certificate_key /etc/less/certificates/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 308 https://less.place$request_uri;
    }
    server {
        listen 443 ssl;
        server_name less.place;
        ssl_certificate /etc/less/certificates/current/fullchain.pem;
        ssl_certificate_key /etc/less/certificates/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_tickets off;
        limit_req zone=per_ip burst=100 nodelay;
        limit_conn connections 20;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        location ^~ /api/accounts/ {
            # Аватар передаётся сырым файлом; лимит совпадает с Accounts (8 МиБ).
            client_max_body_size 8m;
            set $accounts http://accounts:1713;
            proxy_pass $accounts$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
        location ^~ /api/ {
            proxy_pass http://10.130.0.4:1711;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 16m;
        }
        location / {
            set $web http://web:8080;
            proxy_pass $web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Authorization "";
        }
    }
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /health { return 200 "ok\n"; }
        location / { return 503; }
    }
}
