name: less-backoffice-reader
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    cpus: 0.05
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 64
    environment:
      NGINX_WORKER_PROCESSES: '1'
    volumes:
      - /etc/less/backoffice-reader/accounts.conf:/etc/nginx/conf.d/accounts.conf:ro
      - /etc/less/backoffice-transport/accounts.cert.pem:/pki/accounts.cert.pem:ro
      - /etc/less/backoffice-transport/accounts.key.pem:/pki/accounts.key.pem:ro
      - /etc/less/backoffice-reader/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/less/backoffice-transport/control-plane.cert.pem:/pki/server.cert.pem:ro
      - /etc/less/backoffice-transport/control-plane.key.pem:/pki/server.key.pem:ro
      - /etc/less/backoffice-transport/ca.cert.pem:/pki/ca.cert.pem:ro
      - /etc/less/backoffice-transport/ca.crl.pem:/pki/ca.crl.pem:ro
    networks:
      database: {}
      access:
        aliases: [control-plane.backoffice.internal, accounts.backoffice.internal]
    logging: *logging
  reader:
    image: cr.yandex/crp5f6o2ivb58ruhp27e/control-plane:latest
    restart: unless-stopped
    init: true
    cpus: 0.10
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    network_mode: service:proxy
    depends_on: [proxy]
    command: [serve-backoffice, --port, "18481"]
    env_file:
      - path: /etc/less/backoffice-reader/reader.env
        format: raw
      - path: /etc/less/secrets/monium.env
        format: raw
    environment:
      OTEL_SDK_DISABLED: 'false'
      OTEL_SERVICE_NAME: control-plane-backoffice-reader
      APP_MODE: production
      APP_STAND: production
      APP_SHARD: '1'
      LOG_FILE_PATH: /var/log/less/backoffice-reader.log
      LOG_LEVEL: info
    volumes:
      - /var/log/less/backoffice-reader:/var/log/less
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:18481/health']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    logging: *logging
  accounts:
    image: cr.yandex/crp5f6o2ivb58ruhp27e/accounts:latest
    restart: unless-stopped
    init: true
    cpus: 0.10
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    network_mode: service:proxy
    depends_on: [proxy]
    command: [serve-backoffice, --port, "18482"]
    env_file:
      - path: /etc/less/backoffice-reader/accounts.env
        format: raw
      - path: /etc/less/secrets/monium.env
        format: raw
    environment:
      OTEL_SDK_DISABLED: 'false'
      OTEL_SERVICE_NAME: accounts-backoffice-reader
      APP_MODE: production
      APP_STAND: production
      APP_SHARD: '1'
      LOG_FILE_PATH: /var/log/less/backoffice-accounts.log
      LOG_LEVEL: info
    volumes:
      - /var/log/less/backoffice-reader:/var/log/less
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:18482/health']
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
    logging: *logging
networks:
  database:
    external: true
    name: less-database
  access:
    name: less-backoffice-access
